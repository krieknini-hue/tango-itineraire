<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#120b0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tango Itinéraire" />
    <meta name="description" content="Trouvez les milongas, festivals et pratiques de tango argentin sur votre route dans l'esprit de l'âge d'or de Buenos Aires." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Polices Vintage Âge d'Or Tango Haute Lisibilité (Cinzel épuré, Playfair Display, Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Tango Itinéraire — Milongas de l'Âge d'Or sur votre Route</title>
    <script>
      // Verrouillage natif du zoom/dézoom tactile (iOS Safari & Android) hors carte interactive
      document.addEventListener('gesturestart', function (e) {
        if (!e.target.closest || !e.target.closest('.leaflet-container')) {
          e.preventDefault();
        }
      }, { passive: false });
      document.addEventListener('touchmove', function (e) {
        if (e.touches && e.touches.length > 1) {
          if (!e.target.closest || !e.target.closest('.leaflet-container')) {
            e.preventDefault();
          }
        }
      }, { passive: false });
    </script>
  </head>
  <body class="bg-[#120b0a] text-[#f7f2e7] antialiased selection:bg-[#d4af37] selection:text-[#120b0a] overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
